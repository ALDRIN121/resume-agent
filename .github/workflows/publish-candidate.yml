name: Prepare or publish an approved candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from pyproject.toml
        type: string
        required: true
      publish:
        description: Publish only after the separate release approval and checklist
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Check the explicitly selected version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          uv run python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert version == os.environ['REQUESTED_VERSION'], 'Candidate version changed'
          if os.environ['PUBLISH_REQUESTED'] == 'true':
              assert os.environ['GITHUB_REF'] == 'refs/tags/v' + version, 'Publication requires the exact version tag'
          PY
      - run: uv build
      - run: uv run pytest -q tests/test_packaged_ui.py tests/test_skill_distribution.py
      - uses: actions/upload-artifact@v5
        with:
          name: approved-candidate-distributions
          path: dist/*
  publish:
    if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: approved-candidate-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
