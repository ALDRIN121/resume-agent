[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-generator"
version = "2.0.1"
description = "AI-powered multi-agent resume generator — LangGraph + LaTeX + Rich CLI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # LangGraph / LangChain (floors track the tested 1.x lock; some carry CVE fixes)
    "langgraph>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langchain-core>=1.3.3",
    "langchain-anthropic>=1.0.0",
    "langchain-openai>=1.1.14",
    "langchain-ollama>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "langchain-nvidia-ai-endpoints>=1.0.0",
    # Pydantic
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    # HTTP + Scraping
    "httpx>=0.28.0",
    "beautifulsoup4>=4.13.0",
    "readability-lxml>=0.8.4",
    "playwright>=1.50.0",
    # PDF / LaTeX
    "pdf2image>=1.17.0",
    "pypdf>=5.0.0",
    "jinja2>=3.1.0",
    # CLI / UI
    "typer>=0.15.0",
    "rich>=13.9.0",
    "questionary>=2.0.0",
    # Config / Utilities
    "pyyaml>=6.0.0",
    "python-slugify>=8.0.0",
    # Local web app
    "fastapi>=0.115.0",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "websockets>=14.0",
]

[project.scripts]
resume-generator = "resume_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]
